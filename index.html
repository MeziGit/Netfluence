<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0" />
  <!-- The build replaces the title and the marker below with each page's tags (scripts/prerender.js). -->
  <title>Netfluence</title>
  <!--page-meta-->
  <meta name="author" content="Netfluence" />
  <meta name="theme-color" content="#111417" />

  <!-- Standard favicon (.ico is widely supported) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <!-- SVG Favicon (modern browsers) -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- PNG favicons for modern browsers -->
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icon-64.png" sizes="64x64" />
  <!-- Apple Touch Icon (for iOS devices) -->
  <link rel="apple-touch-icon" href="/icon-192.png" sizes="192x192" />
  <!-- Microsoft Tile Image -->
  <meta name="msapplication-TileImage" content="/icon-192.png" />
  <!-- For larger icons to use in browsers -->
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="icon" type="image/png" href="/icon-512.png" sizes="512x512" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZZ6405JJ3N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-ZZ6405JJ3N');
  </script>

  <!-- Microsoft Clarity Analytics -->
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "quub6qff3z");
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- Hidden form for Netlify Forms detection -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="company" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
    <select name="budget">
      <option value="less than $5k">Less than $5,000</option>
      <option value="$5k-$10k">$5,000 - $10,000</option>
      <option value="$10k-$25k">$10,000 - $25,000</option>
      <option value="$25k-$50k">$25,000 - $50,000</option>
      <option value="$50k+">$50,000+</option>
    </select>
  </form>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
